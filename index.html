<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Penerbit Pena Bisa - Toko Buku Literasi Modern</title>
  
  <!-- Font Modern Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Index Standalone CSS -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body data-page="beranda">

  <!-- NAVBAR LIGHT MODERN -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        Toko <span>Pena Bisa</span>
      </a>
      
      <nav class="nav-links">
        <a href="index.html" class="active">Beranda</a>
        <a href="katalog.html">Katalog</a>
        <a href="bundling.html">Paket Bundling</a>
      </nav>

      <div class="nav-right">
        <a href="cart.html" class="btn-cart-light">
          🛒 Keranjang <span id="cartBadge" class="badge-count">0</span>
        </a>
        <a href="https://penabisa.com" target="_blank" rel="noopener" class="btn-publisher">
          Web Utama ↗
        </a>
      </div>
    </div>
  </header>

  <!-- HERO BANNER PROMOSI -->
  <div class="hero-wrapper">
    <section class="hero-card">
      <span id="heroBadge" class="badge-pill">Loading...</span>
      <h1 id="heroHeadline">Toko Buku Resmi Pena Bisa</h1>
      <p id="heroSubheadline">Memuat informasi penerbitan...</p>
      
      <div class="hero-buttons">
        <a id="heroCtaPrimary" href="katalog.html" class="btn-brand-primary">Jelajahi Katalog</a>
        <a id="heroCtaSecondary" href="bundling.html" class="btn-brand-secondary">Paket Bundling</a>
      </div>
    </section>
  </div>

  <!-- INFORMASI LAYANAN (3 CARDS) -->
  <div class="section-wrapper">
    <section class="info-grid" id="infoServicesGrid">
      <!-- Injected dynamically via JS from data/index.json -->
    </section>
  </div>

  <!-- BUKU BEST SELLER SECTIONS -->
  <div class="section-wrapper">
    <section>
      <div class="section-title-box">
        <span id="bestSellerBadge" class="badge-pill">Pilihan Pembaca</span>
        <h2 id="bestSellerTitle">🔥 Buku Best Seller</h2>
        <p id="bestSellerSubtitle">Koleksi terfavorit yang paling banyak dicari</p>
      </div>

      <div id="bestSellerGrid" class="product-grid-light">
        <!-- Injected dynamically via JS -->
      </div>
    </section>
  </div>

  <!-- SCRIPT ENGINE -->
  <script src="js/main.js"></script>
</body>
</html>
