<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Penerbit Pena Bisa - Toko Buku Literasi Modern</title>
  
  <!-- Font Modern Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Single Global CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="beranda">

  <!-- MASTER HEADER MODULAR (DILOAD AUTOMATIC VIA JS) -->
  <div id="globalHeader"></div>

  <!-- BANNER PROMO & HERO WRAPPER -->
  <div class="hero-wrapper">
    <!-- BANNER PROMOSI UTAMA -->
    <a id="bannerPromoLink" href="katalog.html" class="banner-promo-container">
      <img id="bannerPromoImg" src="assets/banner-default.png" alt="Banner Promosi Pena Bisa">
    </a>

    <!-- HERO INTRO CARD -->
    <section class="hero-card">
      <span id="heroBadge" class="badge-pill">Loading...</span>
      <h1 id="heroHeadline">Toko Buku Resmi Pena Bisa</h1>
      <p id="heroSubheadline">Memuat informasi penerbitan...</p>
      
      <div class="hero-buttons">
        <a id="heroCtaPrimary" href="katalog.html" class="btn-brand-primary">Jelajahi Katalog</a>
        <a id="heroCtaSecondary" href="bundling.html" class="btn-brand-secondary">Paket Bundling</a>
      </div>
    </section>
  </div>

  <!-- INFORMASI LAYANAN (3 CARDS) -->
  <div class="section-wrapper">
    <section class="info-grid" id="infoServicesGrid">
      <!-- Injected via JS dari data/index.json -->
    </section>
  </div>

  <!-- SHOWCASE KATEGORI LENGKAP (KATEGORI A-V) -->
  <div class="section-wrapper">
    <section>
      <div class="section-title-box">
        <span id="catBadge" class="badge-pill">Eksplorasi Literasi</span>
        <h2 id="catTitle">🏷️ Kategori Buku Terbitan</h2>
        <p id="catSubtitle">Pilih bidang keilmuan dan minat baca yang Anda cari</p>
      </div>

      <div id="categoryGrid" class="category-grid">
        <!-- Injected via JS dari data/index.json -->
      </div>
    </section>
  </div>

  <!-- MASTER FOOTER MODULAR (DILOAD AUTOMATIC VIA JS) -->
  <div id="globalFooter"></div>

  <!-- CORE ENGINE SCRIPT -->
  <script src="js/main.js"></script>
</body>
</html>
