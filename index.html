<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Redirect Otomatis ke Modul Beranda -->
  <meta http-equiv="refresh" content="0; url=beranda/index.html">
  
  <script>
    // Fallback Redirection via JavaScript
    window.location.href = "beranda/index.html";
  </script>
  
  <style>
    /* Styling Sederhana Saat Masa Transisi Redirect */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      color: #0f172a;
    }
    .redirect-box {
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #f97316;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="redirect-box">
    <div class="spinner"></div>
    <p>Mengarahkan ke Toko Penerbit Pena Bisa...</p>
    <p><small>Jika halaman tidak berpindah otomatis, <a href="beranda/index.html">klik di sini</a>.</small></p>
