<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Bundling - Toko Penerbit Pena Bisa</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body data-page="detailbundling">

  <!-- HEADER GLOBAL -->
  <header class="navbar">
    <div class="navbar-brand">
      <a href="index.html" class="logo">Toko Pena Bisa</a>
    </div>
    <nav class="nav-menu">
      <a href="index.html">Beranda</a>
      <a href="katalog.html">Katalog</a>
      <a href="bundling.html">Paket Bundling</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="btn-cart-nav">
        🛒 Keranjang <span id="cartBadge" class="badge">0</span>
      </a>
      <a href="https://penabisa.com" target="_blank" rel="noopener" class="btn-shortcut">Web Penerbit ↗</a>
    </div>
  </header>

  <main class="detail-container">
    <div id="bundlingLoading" class="loading-state">Memuat data paket bundling...</div>

    <div id="bundlingView" class="detail-wrapper hidden">
      <!-- KIRI: CAROUSEL FEED SLIDE ALA IG -->
      <div class="detail-media">
        <div id="bundlingFeedMain" class="main-image-box"></div>
        <div id="bundlingFeedList" class="thumbnail-list"></div>
      </div>

      <!-- KANAN: RINCIAN DAFTAR BUKU YANG DIBUNDLING & AKSI -->
      <div class="detail-info">
        <span class="badge-bundling">Paket Hemat Bundling</span>
        <h1 id="bundlingTitle">Nama Paket Bundling</h1>
        
        <!-- RINGKASAN DAFTAR BUKU DALAM PAKET -->
        <div class="bundling-items-card">
          <h3>📦 Buku yang Termasuk Dalam Paket:</h3>
          <ul id="bundlingBookList" class="bundled-books-ul">
            <!-- Injected by JS dari metabuku.json (metadata per buku) -->
          </ul>
        </div>

        <!-- PRICING & BUY BUTTONS (HANYA BUKU CETAK / HYBRID) -->
        <div class="action-card">
          <div class="price-row">
            <span class="label">Harga Paket Bundling:</span>
            <strong id="bundlingPriceTag" class="price-tag-lg">Rp 0</strong>
          </div>

          <div class="btn-group-cetak">
            <a id="btnShopeeBundling" href="#" target="_blank" class="btn-shopee hidden">Shopee</a>
            <a id="btnTokopediaBundling" href="#" target="_blank" class="btn-tokopedia hidden">Tokopedia</a>
            <a id="btnWaBundling" href="#" target="_blank" class="btn-wa">Beli Langsung via WA</a>
          </div>

          <button id="btnAddToCartBundling" class="btn-cart-add">+ Masukkan Keranjang</button>
        </div>
      </div>
    </div>

    <!-- DESKRIPSI COPYWRITING PROMO & PENJELASAN PAKET -->
    <section id="bundlingExtra" class="detail-extra hidden">
      <div class="tab-content">
        <h2>Rincian Promo & Penjelasan Bundling</h2>
        <div id="bundlingMarkdown" class="markdown-body"></div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
